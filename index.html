<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fund Your Dreams lists verified scholarships, internships and fellowships with official links and direct details."
    />
    <title>Fund Your Dreams</title>
    <style>
      :root {
        --bg: #f6efe6;
        --panel: #fffdf9;
        --panel-strong: #ffffff;
        --ink: #142033;
        --ink-soft: #465876;
        --muted: #677892;
        --line: #e8dcc5;
        --primary: #f56a2a;
        --primary-dark: #dc5727;
        --primary-soft: #fff0e7;
        --accent: #0f7d73;
        --accent-soft: #def3ef;
        --shadow: 0 18px 44px rgba(17, 32, 51, 0.08);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(245, 106, 42, 0.08), transparent 28%),
          radial-gradient(circle at top right, rgba(15, 125, 115, 0.08), transparent 24%),
          var(--bg);
        color: var(--ink);
        line-height: 1.55;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button, input, select, textarea {
        font: inherit;
      }

      .container {
        width: min(1180px, 92vw);
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 253, 249, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }

      .nav {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        font-weight: 800;
        letter-spacing: -0.04em;
        font-size: clamp(1.2rem, 3vw, 1.7rem);
      }

      .brand span {
        color: var(--primary);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 999px;
        padding: 0.72rem 1.2rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 10px 20px rgba(245, 106, 42, 0.2);
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .btn-secondary {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .hero {
        padding: 42px 0 22px;
      }

      .hero-inner {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(245, 106, 42, 0.09), rgba(15, 125, 115, 0.06)),
          var(--panel);
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: clamp(1.8rem, 5vw, 4rem);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary-soft);
        color: var(--primary-dark);
        border: 1px solid #f5d6c7;
        border-radius: 999px;
        padding: 0.45rem 0.8rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      .hero-copy {
        max-width: 62ch;
        color: var(--ink-soft);
        font-size: 1.04rem;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      .page {
        padding: 18px 0 60px;
      }

      .page-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .listing-wrap {
        padding: 18px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter-btn {
        border: 1px solid var(--line);
        background: white;
        color: var(--ink-soft);
        border-radius: 999px;
        padding: 0.48rem 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }

      .filter-btn.active {
        background: var(--accent-soft);
        border-color: #bfe8e2;
        color: var(--accent);
      }

      .posts {
        display: grid;
        gap: 14px;
      }

      .card {
        border: 1px solid var(--line);
        background: var(--panel-strong);
        border-radius: 18px;
        padding: 18px 18px 14px;
        cursor: pointer;
        transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        border-color: #d8c8b0;
        transform: translateY(-1px);
      }

      .card.active {
        border-color: rgba(15, 125, 115, 0.7);
        box-shadow: 0 10px 18px rgba(15, 125, 115, 0.08);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

      .pill {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 0.32rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .pill.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: clamp(1.1rem, 2vw, 1.45rem);
        line-height: 1.2;
      }

      .summary {
        color: var(--ink-soft);
        margin: 0 0 12px;
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .link-btn {
        color: var(--accent);
        font-weight: 700;
      }

      .details-panel {
        padding: 20px;
      }

      .detail-empty {
        min-height: 240px;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 16px;
      }

      .detail-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .detail-title {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 2.8vw, 2.3rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .hostline {
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 18px;
      }

      .facts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .fact {
        padding: 12px 14px;
        background: #faf7f1;
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .fact-label {
        display: block;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .fact-value {
        font-weight: 800;
      }

      .detail-section {
        margin-top: 20px;
      }

      .detail-section h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .detail-section p,
      .detail-section li {
        color: var(--ink-soft);
      }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .post-detail {
        display: none;
      }

      .post-detail.visible {
        display: block;
      }

      .detail-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(220px, 0.9fr);
        gap: 30px;
        align-items: stretch;
      }

      .detail-image {
        min-height: 260px;
        width: 100%;
        border-radius: 22px;
        object-fit: cover;
        display: block;
      }

      .detail-summary {
        font-size: 1.08rem;
        color: var(--ink-soft);
      }

      .detail-list {
        padding-left: 1.2rem;
        color: var(--ink-soft);
      }

      .detail-list li + li {
        margin-top: 8px;
      }

      .detail-back {
        margin-bottom: 20px;
      }

      @media (max-width: 900px) {
        .page-grid,
        .detail-hero {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .nav {
          height: auto;
          padding: 16px 0;
          flex-direction: column;
          align-items: flex-start;
        }

        .facts {
          grid-template-columns: 1fr;
        }

        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a href="#" class="brand">Fund <span>Your</span> Dreams</a>
        <a class="btn btn-primary" href="#posts">Explore opportunities</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-inner">
          <span class="eyebrow">Verified opportunities</span>
          <h1>Find the funding that moves your next step forward.</h1>
          <p class="hero-copy">
            Explore scholarships, internships, and fellowships with clear funding details, deadlines, and official links.
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#posts">Browse listings</a>
            <a class="btn btn-secondary" href="#posts">Find your match</a>
          </div>
        </div>
      </section>

      <section class="page" id="posts">
        <div class="container page-grid" id="listingView">
          <div class="panel listing-wrap">
            <div class="toolbar">
              <h2>All listings</h2>
              <div class="filters" aria-label="Listing filters">
                <button class="filter-btn active" data-filter="all" type="button">All</button>
                <button class="filter-btn" data-filter="scholarship" type="button">Scholarships</button>
                <button class="filter-btn" data-filter="internship" type="button">Internships</button>
                <button class="filter-btn" data-filter="fellowship" type="button">Fellowships</button>
              </div>
            </div>
            <div id="postsList" class="posts" aria-live="polite"></div>
          </div>

          <aside id="detailsPanel" class="panel details-panel" aria-live="polite"></aside>
        </div>

        <div class="container post-detail" id="postDetailView" aria-live="polite"></div>
      </section>

    </main>

    <script>
      const state = {
        posts: [],
        selectedId: null,
        filter: "all"
      };

      const postsList = document.getElementById("postsList");
      const detailsPanel = document.getElementById("detailsPanel");

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(dateValue) {
        if (!dateValue) return "No deadline listed";
        if (typeof dateValue === "string" && dateValue.includes("-")) {
          const [year, month, day] = dateValue.split("-").map(Number);
          const parsed = new Date(year, month - 1, day);
          return parsed.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        }
        const date = new Date(dateValue);
        if (Number.isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function renderPosts() {
        const visiblePosts = state.posts.filter((post) => state.filter === "all" || post.type === state.filter);

        if (!visiblePosts.length) {
          postsList.innerHTML = '<div class="detail-empty">No published listings match this filter yet.</div>';
          return;
        }

        postsList.innerHTML = visiblePosts
          .map(
            (post) => `
              <article class="card ${post.id === state.selectedId ? "active" : ""}" data-id="${post.id}">
                <div class="meta-row">
                  <span class="pill">${escapeHtml(post.type)}</span>
                  <span class="pill accent">${escapeHtml(post.country || "Global")}</span>
                </div>
                <h3>${escapeHtml(post.title)}</h3>
                <p class="summary">${escapeHtml(post.summary || post.details || post.desc || "")}</p>
                <div class="card-footer">
                  <span>${escapeHtml(post.host || post.org || "Host not listed")}</span>
                  <a class="link-btn" href="#post/${escapeHtml(post.id)}">View details</a>
                </div>
              </article>
            `
          )
          .join("");

        postsList.querySelectorAll(".card").forEach((card) => {
          card.addEventListener("click", () => {
            state.selectedId = card.dataset.id;
            window.location.hash = `post/${state.selectedId}`;
          });
        });
      }

      function renderDetails() {
        const selected = state.posts.find((post) => post.id === state.selectedId);

        if (!selected) {
          detailsPanel.innerHTML = '<div class="detail-empty">Select a listing to read the full details.</div>';
          return;
        }

        const detailHtml = `
          <div class="detail-header">
            <span class="pill">${escapeHtml(selected.type)}</span>
            <span class="pill accent">${escapeHtml(selected.country || "Global")}</span>
          </div>
          <h2 class="detail-title">${escapeHtml(selected.title)}</h2>
          <p class="hostline">${escapeHtml(selected.host || selected.org || "Organization not listed")}</p>

          <div class="facts">
            <div class="fact">
              <span class="fact-label">Funding</span>
              <span class="fact-value">${escapeHtml(selected.funding || "Not specified")}</span>
            </div>
            <div class="fact">
              <span class="fact-label">Deadline</span>
              <span class="fact-value">${escapeHtml(formatDate(selected.deadline))}</span>
            </div>
          </div>

          <div class="detail-section">
            <h3>Summary</h3>
            <p>${escapeHtml(selected.summary || selected.desc || "No summary added yet.")}</p>
          </div>

          <div class="detail-section">
            <h3>Full details</h3>
            <p>${escapeHtml(selected.details || selected.overview || "No details added yet.")}</p>
          </div>

          <div class="detail-section">
            <h3>Eligibility</h3>
            <p>${escapeHtml(selected.eligibility || "Eligibility details are not available.")}</p>
          </div>

          <div class="detail-section">
            <h3>Benefits</h3>
            <p>${escapeHtml(selected.benefits || "Benefits details are not available.")}</p>
          </div>

          <div class="detail-section">
            <h3>Application steps</h3>
            <ul class="detail-list">
              ${escapeHtml(selected.steps || "No application steps available.")
                .split(/\n|\s*\.\s*/)
                .filter((step) => step.trim())
                .map((step) => `<li>${step.trim()}</li>`)
                .join("")}
            </ul>
          </div>

          <div class="detail-actions">
            <a class="btn btn-primary" href="${escapeHtml(selected.link || selected.applyLink || "#")}" target="_blank" rel="noopener noreferrer">Official link</a>
            <a class="btn btn-secondary" href="#posts">Back to listings</a>
          </div>
        `;

        detailsPanel.innerHTML = detailHtml;
      }

      function renderPostDetail() {
        const selected = state.posts.find((post) => post.id === state.selectedId);
        const detailView = document.getElementById("postDetailView");
        const listingView = document.getElementById("listingView");

        if (!selected) {
          detailView.innerHTML = '<div class="detail-empty">This opportunity could not be found.</div>';
          return;
        }

        const details = [
          ["Funding", selected.funding || "Not specified"],
          ["Deadline", formatDate(selected.deadline)],
          ["Country", selected.country || "Global"],
          ["Level", selected.level || "Not specified"],
          ["Host", selected.host || selected.org || "Organization not listed"]
        ];

        detailView.innerHTML = `
          <a class="btn btn-secondary detail-back" href="#posts">← Back to listings</a>
          <article class="panel details-panel">
            <div class="detail-hero">
              <div>
                <div class="detail-header">
                  <span class="pill">${escapeHtml(selected.type)}</span>
                  <span class="pill accent">${escapeHtml(selected.country || "Global")}</span>
                </div>
                <h1 class="detail-title">${escapeHtml(selected.title)}</h1>
                <p class="detail-summary">${escapeHtml(selected.summary || selected.desc || "No summary available.")}</p>
                <div class="facts">
                  ${details
                    .map(
                      ([label, value]) => `
                        <div class="fact">
                          <span class="fact-label">${escapeHtml(label)}</span>
                          <span class="fact-value">${escapeHtml(value)}</span>
                        </div>
                      `
                    )
                    .join("")}
                </div>
                <div class="detail-actions">
                  <a class="btn btn-primary" href="${escapeHtml(selected.link || selected.applyLink || "#")}" target="_blank" rel="noopener noreferrer">Apply now</a>
                  <a class="btn btn-secondary" href="#posts">Browse other opportunities</a>
                </div>
              </div>
              <img class="detail-image" src="${escapeHtml(selected.image || "")}" alt="${escapeHtml(selected.title)}" onerror="this.style.display='none'" />
            </div>

            <div class="detail-section">
              <h2>Overview</h2>
              <p>${escapeHtml(selected.overview || selected.details || "No overview added yet.")}</p>
            </div>

            <div class="detail-section">
              <h2>Eligibility</h2>
              <p>${escapeHtml(selected.eligibility || "Eligibility details are not available.")}</p>
            </div>

            <div class="detail-section">
              <h2>Benefits</h2>
              <p>${escapeHtml(selected.benefits || "Benefits details are not available.")}</p>
            </div>

            <div class="detail-section">
              <h2>Required documents</h2>
              <p>${escapeHtml(selected.documents || "No document list available.")}</p>
            </div>

            <div class="detail-section">
              <h2>Application steps</h2>
              <ul class="detail-list">
                ${escapeHtml(selected.steps || "No application steps available.")
                  .split(/\n|\s*\.\s*/)
                  .filter((step) => step.trim())
                  .map((step) => `<li>${step.trim()}</li>`)
                  .join("")}
              </ul>
            </div>

            <div class="detail-section">
              <h2>Notes</h2>
              <p>${escapeHtml(selected.notes || "No additional notes available.")}</p>
            </div>
          </article>
        `;

        listingView.style.display = "none";
        detailView.classList.add("visible");
      }

      function renderCurrentView() {
        const route = window.location.hash.replace(/^#/, "");
        const match = route.match(/^post\/([^/]+)/);

        if (match && state.posts.length) {
          state.selectedId = match[1];
          renderPostDetail();
          return;
        }

        document.getElementById("postDetailView").classList.remove("visible");
        document.getElementById("listingView").style.display = "grid";
        state.selectedId = state.posts[0]?.id || null;
        renderPosts();
        renderDetails();
      }

      async function loadPosts() {
        const response = await fetch("data/posts.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Unable to load posts");
        }

        const data = await response.json();
        state.posts = (data || []).filter((post) => post.status === "published");
        renderCurrentView();
      }

      document.querySelectorAll(".filter-btn").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach((item) => item.classList.toggle("active", item === button));
          state.filter = button.dataset.filter || "all";
          renderPosts();
        });
      });

      window.addEventListener("hashchange", renderCurrentView);

      loadPosts().catch((error) => {
        console.error(error);
        postsList.innerHTML = '<div class="detail-empty">Unable to load posts.</div>';
      });
    </script>
  </body>
</html>
